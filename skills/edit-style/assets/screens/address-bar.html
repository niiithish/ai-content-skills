<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0}body{width:1080px;height:1920px;background:#141416;font-family:Inter,sans-serif;overflow:hidden;position:relative}
.soft{filter:blur(16px);opacity:.75}
.fav{position:absolute;top:250px;left:90px;right:90px;display:grid;grid-template-columns:repeat(4,1fr);gap:70px 60px}
.fav div{height:170px;border-radius:40px;background:#2a2a2e}.fav div:nth-child(2n){background:#33343a}.fav div:nth-child(3){background:#3b4a63}.fav div:nth-child(6){background:#4a3b33}
.lbl{position:absolute;top:160px;left:90px;color:#e5e5ea;font-size:48px;font-weight:600}
.bar{position:absolute;left:40px;right:40px;top:875px;height:170px;border-radius:85px;background:#2c2c30;display:flex;align-items:center;padding:0 60px;
 box-shadow:0 0 0 4px #4a7dff55,0 20px 60px #0008}
.bar svg{width:64px;height:64px;margin-right:36px;flex:none}
.t{color:#fff;font-size:82px;font-weight:500;letter-spacing:-1px;white-space:nowrap}
.caret{display:inline-block;width:6px;height:90px;background:#4a7dff;margin-left:4px;vertical-align:-14px;opacity:CARETOP}
.sug{position:absolute;left:70px;right:70px;top:1100px;height:120px;border-radius:30px;background:#202024;display:flex;align-items:center;padding:0 40px;gap:30px;color:#d1d1d6;font-size:50px;opacity:SUGOP;filter:blur(3px)}
.kb{position:absolute;left:0;right:0;bottom:0;height:640px;background:#232326;padding:40px 12px}
.row{display:flex;justify-content:center;gap:14px;margin-bottom:26px}
.k{width:92px;height:128px;border-radius:16px;background:#46464b;color:#fff;font-size:56px;display:flex;align-items:center;justify-content:center}
.k.on{background:#8e8e93}
</style></head><body>
<div class="soft"><div class="lbl">Favorites</div><div class="fav"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div></div>
<div class="bar"><svg viewBox="0 0 24 24" fill="none" stroke="#9a9aa0" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
<span class="t">TYPED</span><span class="caret"></span></div>
<div class="sug">🌐 <span>trymysa.store</span></div>
<div class="kb soft" style="opacity:1;filter:blur(7px)"><div class="row">KROW1</div><div class="row">KROW2</div><div class="row">KROW3</div></div>
</body></html>
